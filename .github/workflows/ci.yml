name: CI

# Phase 42: don't allow a broken main. Every push/PR runs the backend
# (lint, typecheck, both Python packages' tests), the frontend (lint,
# typecheck, build), and a Docker build of both images — the same
# checks this project's own development process has run before every
# phase's commit throughout, now enforced automatically instead of by
# hand. Phase 53 added the terraform job: `fmt -check` and `validate`
# against infra/aws/environments/dev, run the same way every IaC phase
# (45-52) was verified locally.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # packages/evals first: apps/api imports caseflow_evals at import
      # time (app/evals/__init__.py) — same two-package install order
      # as the root README's local setup instructions.
      - name: Install packages/evals
        run: pip install -e "packages/evals[dev]"

      - name: Install apps/api
        run: pip install -e "apps/api[dev]"

      - name: Ruff check (apps/api)
        working-directory: apps/api
        run: ruff check .

      - name: Ruff format check (apps/api)
        working-directory: apps/api
        run: ruff format --check .

      - name: mypy (apps/api)
        working-directory: apps/api
        run: mypy app

      - name: Ruff check (packages/evals)
        working-directory: packages/evals
        run: ruff check .

      - name: Ruff format check (packages/evals)
        working-directory: packages/evals
        run: ruff format --check .

      - name: mypy (packages/evals)
        working-directory: packages/evals
        run: mypy caseflow_evals

      - name: pytest (apps/api)
        working-directory: apps/api
        run: pytest -q

      - name: pytest (packages/evals)
        working-directory: packages/evals
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (api/worker/migrate share this)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: caseflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: caseflow-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # No backend is configured (see versions.tf) and no live AWS
      # environment exists, so init only needs to resolve providers —
      # -backend=false skips a state backend Phase 44 deliberately
      # never set up.
      - name: terraform init
        run: terraform init -backend=false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ..

      - name: terraform validate
        run: terraform validate

  e2e:
    name: End-to-end (Playwright over Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Boot the full stack
        run: docker compose up --build -d

      - name: Wait for api and web to report healthy
        run: |
          for i in $(seq 1 60); do
            api_status=$(docker inspect --format='{{.State.Health.Status}}' caseflow-api 2>/dev/null || echo starting)
            web_status=$(docker inspect --format='{{.State.Health.Status}}' caseflow-web 2>/dev/null || echo starting)
            echo "api=$api_status web=$web_status"
            if [ "$api_status" = "healthy" ] && [ "$web_status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not become healthy in time"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, terraform, e2e]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "At least one required job failed."
            exit 1
          fi
