version: "3.9"

# CaseFlow AI — local development environment.
# Phase 0: Postgres + Redis skeleton only.
# apps/api, apps/web, and the worker service are added to this file
# in Phase 24 once those applications exist.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caseflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: caseflow
      POSTGRES_DB: caseflow
    ports:
      - "5432:5432"
    volumes:
      - caseflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow -d caseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: caseflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - caseflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caseflow_postgres_data:
  caseflow_redis_data:
